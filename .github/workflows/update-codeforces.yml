name: Update Codeforces Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

jobs:
  update-codeforces:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update Codeforces card
        run: python scripts/update_codeforces.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/coding/codeforces.svg

          if git diff --cached --quiet; then
            echo "No Codeforces changes."
          else
            git commit -m "Update Codeforces stats"
            git push
          fi
